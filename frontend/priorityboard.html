<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Priority Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/priorityboard.css"/>
</head>
<body>

<div class="wrap">
  <!-- Header -->
  <div class="header">
    <div class="live-badge">
      <div class="pulse-dot"></div>
      <span class="live-text">Live · UTC</span>
    </div>
    <h1>Task Priority</h1>
    <p class="sub">Calculated on-the-fly · never stored in DB</p>
  </div>

  <!-- Stat pills -->
  <div class="stat-row" id="stat-row"></div>

  <!-- Filter bar -->
  <div class="filter-bar" id="filter-bar"></div>

  <!-- Task list -->
  <div id="task-list"></div>
</div>

<script src="javascript/priorityboard.js"></script>
</body>
</html>
