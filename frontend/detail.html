<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายละเอียดงาน — AssignTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <style>
    .detail-container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      color: #6b7280; font-size: 14px; font-weight: 500;
      text-decoration: none; margin-bottom: 28px;
      cursor: pointer; background: none; border: none;
      padding: 0; transition: color 0.2s;
    }
    .back-btn:hover { color: #1d1b54; }

    .detail-card {
      background: #fff; border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .detail-stripe { height: 6px; width: 100%; }

    .detail-body { padding: 32px; }

    .detail-subject {
      display: inline-flex; align-items: center;
      background: #eff6ff; color: #1d1b54;
      font-size: 12px; font-weight: 600;
      padding: 5px 14px; border-radius: 99px;
      margin-bottom: 16px;
    }

    .detail-title {
      font-size: 22px; font-weight: 800;
      color: #111827; margin-bottom: 20px; line-height: 1.3;
    }

    .detail-meta {
      display: flex; flex-direction: column; gap: 14px;
      margin-bottom: 28px;
    }
    .detail-meta-row {
      display: flex; align-items: flex-start; gap: 12px;
      font-size: 14px; color: #374151;
    }
    .detail-meta-label {
      font-size: 12px; font-weight: 600; color: #9ca3af;
      text-transform: uppercase; letter-spacing: 0.5px;
      min-width: 90px; padding-top: 2px;
    }
    .detail-meta-value { color: #111827; font-weight: 500; }

    .detail-intro {
      background: #f8f9fc; border-radius: 12px;
      padding: 16px 20px; font-size: 14px;
      color: #4b5563; line-height: 1.7;
      margin-bottom: 28px;
    }

    .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: #1d1b54; color: #fff;
      padding: 12px 24px; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      text-decoration: none; transition: background 0.2s;
    }
    .btn-primary:hover { background: #27266a; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      background: #f3f4f6; color: #374151;
      padding: 12px 24px; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      text-decoration: none; transition: background 0.2s;
      border: none; cursor: pointer;
    }
    .btn-secondary:hover { background: #e5e7eb; }

    .not-found {
      text-align: center; padding: 60px 20px; color: #9ca3af;
    }
    .not-found svg { margin: 0 auto 16px; display: block; color: #d1d5db; }
    .not-found p { font-size: 15px; }
  </style>
</head>
<body>

<nav class="top-nav">
  <span class="logo-text">Slitherhub 🐍 </span>
</nav>

<div class="detail-container">
  <button class="back-btn" onclick="history.back()">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
    </svg>
    กลับ
  </button>

  <div id="detailArea"></div>
</div>

<script type="module" src="detail.js"></script>
</body>
</html>
