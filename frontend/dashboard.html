<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Dashboard — AssignTrack</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<!-- Top Nav -->
<nav class="top-nav">
  <span class="logo-text">📚 AssignTrack</span>
  <div class="search-bar">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="ค้นหางาน..." oninput="filterAssignments()" />
  </div>
    <div class="profile-icon">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    </div>
  </div>
</nav>

<div class="container">

  
  <!-- Page Header -->
  <div class="page-header">
    <h1 class="page-title">Tasks</h1>
  </div>

  <!-- Stats Grid (clickable filter) -->
  <div class="stats-grid">
    <div class="stat-card total" onclick="quickFilter('all', this)">
      <div class="stat-label">งานทั้งหมด</div>
      <div class="stat-number" id="statTotal">—</div>
      <div class="stat-sub">รายการ</div>
    </div>
    <div class="stat-card submitted" onclick="quickFilter('submitted', this)">
      <div class="stat-label">ส่งแล้ว</div>
      <div class="stat-number" id="statSubmitted">—</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="barSubmitted" style="width:0%"></div></div>
    </div>
    <div class="stat-card pending" onclick="quickFilter('pending', this)">
      <div class="stat-label">ยังไม่ส่ง</div>
      <div class="stat-number" id="statPending">—</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="barPending" style="width:0%"></div></div>
    </div>
    <div class="stat-card late" onclick="quickFilter('late', this)">
      <div class="stat-label">ส่งล่าช้า / เกินกำหนด</div>
      <div class="stat-number" id="statLate">—</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="barLate" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Overview Section: Donut Chart + Upcoming Deadlines -->
  <div class="overview-section" id="overviewSection">

    <!-- Donut Chart -->
    <div class="overview-card">
      <div class="overview-card-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        สถานะงานโดยรวม
      </div>
      <div class="donut-wrap">
        <div class="donut-svg-wrap">
          <svg id="donutSvg" width="140" height="140" viewBox="0 0 140 140"></svg>
          <div class="donut-center-text">
            <div class="donut-center-num" id="donutTotal">0</div>
            <div class="donut-center-label">งานทั้งหมด</div>
          </div>
        </div>
        <div class="donut-legend">
          <div class="legend-item">
            <div class="legend-dot" style="background:#0f766e"></div>
            <span class="legend-label">ส่งแล้ว</span>
            <span class="legend-count" id="legendSubmitted">0</span>
            <span class="legend-pct" id="legendPctSubmitted">(0%)</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:#d97706"></div>
            <span class="legend-label">ยังไม่ส่ง</span>
            <span class="legend-count" id="legendPending">0</span>
            <span class="legend-pct" id="legendPctPending">(0%)</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background:#dc2626"></div>
            <span class="legend-label">ส่งล่าช้า</span>
            <span class="legend-count" id="legendLate">0</span>
            <span class="legend-pct" id="legendPctLate">(0%)</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Upcoming Deadlines -->
    <div class="overview-card">
      <div class="overview-card-title">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        งานที่ใกล้ครบกำหนด
      </div>
      <div class="timeline-list" id="timelineList">
        <div style="text-align:center;color:#9ca3af;font-size:14px;padding:20px 0">ยังไม่มีข้อมูล</div>
      </div>
    </div>

  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('all', this)">งานทั้งหมด</button>
    <button class="tab-btn" onclick="switchTab('bySubject', this)">แยกรายวิชา</button>
    <button class="tab-btn" onclick="switchTab('pending', this)">ยังไม่ส่ง</button>
    <button class="tab-btn" onclick="switchTab('submitted', this)">ส่งแล้ว</button>
    <button class="tab-btn" onclick="switchTab('late', this)">ส่งล่าช้า</button>
  </div>

  <!-- Filter Row -->
  <div class="filter-row" id="filterRow">
    <select class="filter-select" id="sortSelect" onchange="renderCurrentTab()">
      <option value="dueAsc">วันครบกำหนด (ใกล้ที่สุด)</option>
      <option value="dueDesc">วันครบกำหนด (ไกลที่สุด)</option>
      <option value="name">ชื่องาน A–Z</option>
      <option value="subject">รายวิชา</option>
    </select>
    <select class="filter-select" id="subjectFilter" onchange="renderCurrentTab()">
      <option value="all">วิชาทั้งหมด</option>
    </select>
    <span class="filter-count" id="filterCount"></span>
  </div>

  <!-- Content Area -->
  <div id="contentArea"></div>

</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
  <a class="nav-item active" href="#">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Dashboard
  </a>
  <a class="nav-item" href="#">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    งาน
  </a>
  <a class="nav-item" href="#">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    ปฏิทิน
  </a>
  <a class="nav-item" href="#">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    โปรไฟล์
  </a>
</nav>

<div id="toast"></div>

<script type="module" src="./javascript/get_user_task.js"></script>
</body>
</html>
